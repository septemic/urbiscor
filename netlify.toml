[build]
  command = "vite build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Consolidate the public Netlify hostname without redirecting deploy previews.
[[redirects]]
  from = "https://urbiscor.netlify.app/*"
  to = "https://urbiscor.ro/:splat"
  status = 301
  force = true

# Prerendered HTML files must have the same clean URL as their canonical.
# Keep these explicit so /__forms.html retains its GET/POST endpoint.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/servicii.html"
  to = "/servicii"
  status = 301
  force = true

[[redirects]]
  from = "/proiecte.html"
  to = "/proiecte"
  status = 301
  force = true

[[redirects]]
